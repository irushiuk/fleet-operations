x-common-env: &common-env
  POSTGRES_USER: fleet
  POSTGRES_PASSWORD: fleetpass
  POSTGRES_DB: fleetdb
  POSTGRES_HOST: postgres
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  GPS_TOPIC: gps_events
  SIMULATED_DAY_SECONDS: "300"     # 1 simulated day = 5 minutes
  NUM_VEHICLES: "25"
  EMIT_INTERVAL_SECONDS: "3"
  IDLE_ALERT_THRESHOLD_MIN: "2"    # short for demo purposes; justify/adjust in report
  STALE_THRESHOLD_SECONDS: "120"
  LOG_LEVEL: INFO

services:

  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.7.0
    container_name: fleet_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gps_events --partitions 3 --replication-factor 1"]

  # -------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16
    container_name: fleet_postgres
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleetpass
      POSTGRES_DB: fleetdb
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleetdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------- Data sources
  stream-producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: fleet_stream_producer
    command: ["python", "producers/stream_producer.py"]
    environment: *common-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  batch-producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: fleet_batch_producer
    command: ["python", "producers/batch_producer.py"]
    environment: *common-env
    volumes:
      - ./data/batch_incoming:/data/batch_incoming

  # ------------------------------------------------------------ Speed layer
  spark-streaming:
    build:
      context: .
      dockerfile: spark_jobs/Dockerfile
    container_name: fleet_spark_streaming
    environment:
      <<: *common-env
      PG_JDBC_URL: jdbc:postgresql://postgres:5432/fleetdb
      PARQUET_ARCHIVE_PATH: /data/parquet_archive/gps_events
      CHECKPOINT_DIR: /data/checkpoints
    volumes:
      - ./data/parquet_archive:/data/parquet_archive
      - ./data/checkpoints:/data/checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------- Batch layer
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: fleet_airflow
    command: standalone
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fleet:fleetpass@postgres:5432/fleetdb
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data/batch_incoming:/data/batch_incoming
      - ./data/parquet_archive:/data/parquet_archive
    depends_on:
      postgres:
        condition: service_healthy

  airflow-unpause:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: ["bash", "-c", "until airflow dags list | grep -q daily_fleet_reconciliation; do sleep 10; done; airflow dags unpause daily_fleet_reconciliation"]
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fleet:fleetpass@postgres:5432/fleetdb
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow:
        condition: service_started

  # ------------------------------------------------------------- Serving
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fleet_api
    environment: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  watchdog:
    build:
      context: .
      dockerfile: watchdog/Dockerfile
    container_name: fleet_watchdog
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kafka_data:
  pg_data:
